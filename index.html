<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURA-P2 | NASA HUNCH Web Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #0b111e;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .space-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }
    .space-card:hover {
      border-color: rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-cyan-500/10 border border-cyan-500/30 p-2 rounded-lg text-cyan-400">
          <i class="fa-solid fa-seedling text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-wider text-white">PROJECT AURA-P2</h1>
          <p class="text-xs text-slate-400">NASA HUNCH Flight Hardware Telemetry & Crop Database</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="bg-slate-900/60 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-4">
      <button id="tab-telemetry" onclick="switchTab('telemetry')" class="py-3 px-4 font-medium text-sm border-b-2 border-cyan-400 text-cyan-400 flex items-center space-x-2 transition-all cursor-pointer">
        <i class="fa-solid fa-chart-line"></i>
        <span>AURA-P2 Telemetry & System Status</span>
      </button>
      <button id="tab-botanical" onclick="switchTab('botanical')" class="py-3 px-4 font-medium text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2 transition-all cursor-pointer">
        <i class="fa-solid fa-plant-wilt"></i>
        <span>Space Crop Botanical Database (Edible)</span>
      </button>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- TAB 1: TELEMETRY (AURA-P2 Prototype Data) -->
    <section id="content-telemetry" class="space-y-6">
      
      <!-- Live Status Indicators -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="space-card rounded-xl p-5">
          <div class="flex justify-between items-center text-slate-400 text-sm">
            <span>Soil Moisture</span>
            <i class="fa-solid fa-droplet text
